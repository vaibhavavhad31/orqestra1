# Render Blueprint for Orqestra (free plan). Secrets are prompted in the Render dashboard, never stored here.
services:
  - type: web
    runtime: docker
    name: orqestra
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL          # MongoDB Atlas connection string (paste in the dashboard)
        sync: false
      - key: DB_NAME
        value: orqestra
      - key: JWT_SECRET         # random value generated by Render
        generateValue: true
      - key: DEMO_PASSWORD      # password shared by the demo accounts (paste in the dashboard)
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: LLM_API_KEY        # optional: leave empty to use the free built-in decomposition rules
        sync: false
